<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; user-select: none;
    }
    .box { text-align: center; }
    .logo { width: 96px; height: 96px; margin: 0 auto 24px; opacity: .95; }
    .spinner {
      width: 28px; height: 28px; margin: 28px auto 0;
      border: 3px solid #21262d; border-top-color: #6e7a8c;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 600; color: #e6edf3; }
    p  { margin-top: 10px; font-size: 13px; color: #8b949e; }
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="whale.png" alt="DeepSeek Harness" />
    <h1>正在启动 DeepSeek Harness…</h1>
    <p>首次启动可能需要一些时间，请稍候</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
